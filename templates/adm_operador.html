{% extends "base.html" %}
{% block content %}

<div class="container-fluid mt-4 px-lg-4">

    <div class="row justify-content-center mb-3">
        <div class="col-12 col-xl-9">
            <div class="card">
                <div class="card-body py-3 d-flex justify-content-between align-items-center flex-wrap">
                    <h5 class="mb-0 font-weight-bold text-dark">
                        <i class="fas fa-id-badge mr-2" style="color: #D90429;"></i> Gestão de Operadores
                    </h5>
                    <div class="mt-2 mt-sm-0">
                        <button type="button" class="btn btn-brand mx-1" id="botao-adicionar">
                            <i class="fas fa-plus mr-1"></i> Adicionar
                        </button>
                        <button type="button" class="btn btn-dark mx-1" id="botao-editar">
                            <i class="fas fa-edit mr-1"></i> Editar
                        </button>
                        <button type="button" class="btn btn-danger mx-1" id="botao-apagar">
                            <i class="fas fa-trash mr-1"></i> Excluir
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-xl-9">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table text-center" id="tabela-operadores"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Modal Adicionar -->
<div class="modal fade" id="adicionar-modal">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-plus mr-2"></i> Adicionar Operador</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>

            <div class="modal-body">
                <form id="adicionar-formulario">
                    <div class="form-group">
                        <label class="font-weight-bold">Nome</label>
                        <input type="text" class="form-control" id="adicionar-nome" required>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">Chapa / Matrícula</label>
                        <input type="text" class="form-control" id="adicionar-codigo" required>
                        <span class="text-danger small" id="codigo-erro"></span>
                    </div>

                    <button type="submit" class="btn btn-brand w-100 mt-3">
                        <i class="fas fa-save mr-1"></i> Salvar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal Editar -->
<div class="modal fade" id="editar-modal">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-edit mr-2"></i> Editar Operador</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>

            <div class="modal-body">
                <form id="editar-formulario">
                    <input type="hidden" id="editar-id">

                    <div class="form-group">
                        <label class="font-weight-bold">Nome</label>
                        <input type="text" class="form-control" id="editar-nome" required>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">Chapa / Matrícula</label>
                        <input type="text" class="form-control" id="editar-codigo" required>
                    </div>

                    <button type="submit" class="btn btn-brand w-100 mt-3">
                        <i class="fas fa-save mr-1"></i> Atualizar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
{% block scripts %}
<script>
var table = $('#tabela-operadores').DataTable({
    ajax: {
        url: '/dados_operadores',
        dataSrc: 'operadores'
    },
    pageLength: 10,
    bLengthChange: false,
    language: {
        url: "/static/js/pt-BR.json" 
    },
    columns: [
        { data: "nome", title: "Nome do Operador", render: function(d) { return '<strong>' + escapeHtml(d) + '</strong>'; } },
        { data: "codigo", title: "Chapa / Matrícula", render: function(d) { return '<code>' + escapeHtml(d) + '</code>'; } }
    ]
});

$('#tabela-operadores').on('click', 'tbody tr', function () {
    var row = table.row(this);
    if (!row.data()) return;

    table.$('tr.tableSelected').removeClass('tableSelected');
    $(this).addClass('tableSelected');
});

$('#botao-adicionar').click(function(){
    $('#adicionar-formulario')[0].reset();
    $('#adicionar-modal').modal('show');
});

$('#adicionar-formulario').submit(function(e){
    e.preventDefault();

    $.ajax({
        url: '/dados_operadores',
        type: 'POST',
        data: {
            nome: $('#adicionar-nome').val(),
            codigo: $('#adicionar-codigo').val()
        },
        success: function(response){
            if(response.success){
                $('#adicionar-modal').modal('hide');
                table.ajax.reload(null, false);
                msgSucesso('Operador cadastrado com sucesso.');
            } else {
                msgErro(response.error);
            }
        },
        error: function(){
            msgErro("Chapa já cadastrada ou inválida.");
        }
    });
});

$('#botao-editar').click(function(){
    var selectedRow = table.row('.tableSelected');
    if(!selectedRow.data()){
        msgAviso("Selecione um operador na tabela primeiro.");
        return;
    }

    var data = selectedRow.data();
    $('#editar-id').val(data.id);
    $('#editar-nome').val(data.nome);
    $('#editar-codigo').val(data.codigo);
    $('#editar-modal').modal('show');
});

$('#editar-formulario').submit(function(e){
    e.preventDefault();

    $.ajax({
        url: '/dados_operadores',
        type: 'PUT',
        data: {
            id: $('#editar-id').val(),
            nome: $('#editar-nome').val(),
            codigo: $('#editar-codigo').val()
        },
        success: function(response){
            if(response.success){
                $('#editar-modal').modal('hide');
                msgSucesso('Operador atualizado com sucesso.');
                table.ajax.reload(null, false);
            } else {
                msgErro(response.error);
            }
        }
    });
});

$('#botao-apagar').click(function(){
    var selectedRow = table.row('.tableSelected');
    if(!selectedRow.data()){
        msgAviso("Selecione um operador na tabela primeiro.");
        return;
    }

    var data = selectedRow.data();

    Swal.fire({
        title: 'Inativar Operador?',
        text: "Deseja realmente remover o operador '" + data.nome + "'?",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#D90429',
        cancelButtonText: 'Cancelar',
        confirmButtonText: 'Sim, remover!'
    }).then((result) => {
        if (result.isConfirmed) {
            $.ajax({
                url: '/dados_operadores',
                type: 'DELETE',
                data: { id: data.id },
                success: function(){
                    table.ajax.reload(null, false);
                    msgSucesso('Operador removido com sucesso.');
                }
            });
        }
    });
});

$(document).on('click', function(e){
    if (!$(e.target).closest('#tabela-operadores, .modal, .btn').length) {
        table.$('tr.tableSelected').removeClass('tableSelected');
    }
});
</script>
{% endblock %}
