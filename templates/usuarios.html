{% extends "base.html" %}
{% block content %}

<div class="container-fluid mt-4 px-lg-4" id="usuarios-container" data-user-id="{{ current_user.id }}">

    <!-- Barra de Título e Ações -->
    <div class="row justify-content-center mb-3">
        <div class="col-12 col-xl-9">
            <div class="card">
                <div class="card-body py-3 d-flex justify-content-between align-items-center flex-wrap">
                    <h5 class="mb-0 font-weight-bold text-dark">
                        <i class="fas fa-users-cog mr-2" style="color: #D90429;"></i> Gestão de Usuários
                    </h5>
                    <div class="mt-2 mt-sm-0">
                        <button type="button" class="btn btn-brand mx-1" id="botao-adicionar">
                            <i class="fas fa-user-plus mr-1"></i> Adicionar
                        </button>
                        <button type="button" class="btn btn-dark mx-1" id="botao-editar">
                            <i class="fas fa-user-edit mr-1"></i> Editar
                        </button>
                        <button type="button" class="btn btn-danger mx-1" id="botao-apagar">
                            <i class="fas fa-trash mr-1"></i> Excluir
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabela de Usuários -->
    <div class="row d-flex justify-content-center">
        <div class="col-12 col-xl-9">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table text-center" id="tabela-usuarios">
                            <thead></thead>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Modal Editar Usuário -->
<div class="modal fade" id="editar-modal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-user-edit mr-2"></i> Editar Usuário</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>

            <div class="modal-body">
                <form id="editar-formulario">
                    <input type="hidden" id="editar-id">

                    <div class="form-group">
                        <label class="font-weight-bold" for="editar-usuario">Usuário</label>
                        <input type="text" class="form-control" id="editar-usuario" required>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold" for="editar-privilegios">Nível de Acesso</label>
                        <select class="form-control" id="editar-privilegios" required>
                            <option value="1">Operacional</option>
                            <option value="2">PCP / Supervisor</option>
                            <option value="3">Administrador</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold" for="editar-setor">Setor</label>
                        <select class="form-control" id="editar-setor">
                            <option value="" disabled>Selecione</option>
                            <option value="materia_prima">Matéria-prima</option>
                            <option value="estamparia">Estamparia</option>
                            <option value="solda">Solda</option>
                            <option value="retifica">Retífica</option>
                            <option value="envio_terceiros">Envio para terceiros</option>
                            <option value="recebimento_terceiros">Recebimentos (terceiros)</option>
                            <option value="inspecao_final">Inspeção final</option>
                            <option value="expedicao">Expedição</option>
                        </select>
                    </div>

                    <div class="border-top my-3"></div>

                    <div class="form-group position-relative">
                        <label class="font-weight-bold" for="editar-nova-senha">Nova Senha (opcional)</label>
                        <input type="password" class="form-control pr-5" id="editar-nova-senha">
                        <i class="fas fa-eye" id="toggleNovaSenha"
                           style="position:absolute; right:15px; top:42px; cursor:pointer; color:#545b61;"></i>
                    </div>

                    <div class="form-group position-relative">
                        <label class="font-weight-bold" for="editar-confirmar-senha">Confirmar Senha</label>
                        <input type="password" class="form-control pr-5" id="editar-confirmar-senha">
                        <i class="fas fa-eye" id="toggleConfirmarSenha"
                           style="position:absolute; right:15px; top:42px; cursor:pointer; color:#545b61;"></i>
                    </div>

                    <div class="text-center">
                        <span class="formErrorMsg" id="editarSenhaErro"></span>
                    </div>

                    <button type="submit" class="btn btn-brand mt-3 w-100">
                        <i class="fas fa-save mr-1"></i> Salvar Alterações
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal Adicionar Usuário -->
<div class="modal fade" id="adicionar-modal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-user-plus mr-2"></i> Adicionar Usuário</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>

            <div class="modal-body">
                <form id="adicionar-formulario">
                    <div class="form-group">
                        <label class="font-weight-bold" for="adicionar-usuario">Usuário</label>
                        <input type="text" class="form-control" id="adicionar-usuario" required>
                        <span class="formErrorMsg" id="adicionar-login-erro"></span>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold" for="adicionar-privilegios">Nível de Acesso</label>
                        <select class="form-control" id="adicionar-privilegios" required>
                            <option value="1">Operacional</option>
                            <option value="2">PCP / Supervisor</option>
                            <option value="3">Administrador</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold" for="adicionar-setor">Setor</label>
                        <select class="form-control" id="adicionar-setor" disabled>
                            <option value="" disabled selected>Selecione</option>
                            <option value="materia_prima">Matéria-prima</option>
                            <option value="estamparia">Estamparia</option>
                            <option value="solda">Solda</option>
                            <option value="retifica">Retífica</option>
                            <option value="envio_terceiros">Envio para terceiros</option>
                            <option value="recebimento_terceiros">Recebimentos (terceiros)</option>
                            <option value="inspecao_final">Inspeção final</option>
                            <option value="expedicao">Expedição</option>
                        </select>
                    </div>

                    <div class="border-top my-3"></div>

                    <div class="form-group position-relative">
                        <label class="font-weight-bold" for="adicionar-senha">Senha</label>
                        <input type="password" class="form-control pr-5" id="adicionar-senha" minlength="6" required>
                        <i class="fas fa-eye" id="toggleAdicionarSenha"
                           style="position:absolute; right:15px; top:42px; cursor:pointer; color:#545b61;"></i>
                    </div>

                    <div class="form-group position-relative">
                        <label class="font-weight-bold" for="adicionar-confirmar-senha">Confirmar Senha</label>
                        <input type="password" class="form-control pr-5" id="adicionar-confirmar-senha" minlength="6" required>
                        <i class="fas fa-eye" id="toggleAdicionarConfirmarSenha"
                           style="position:absolute; right:15px; top:42px; cursor:pointer; color:#545b61;"></i>
                    </div>

                    <div class="text-center">
                        <span class="formErrorMsg" id="adicionarSenhaErro"></span>
                    </div>

                    <button type="submit" class="btn btn-brand mt-3 w-100">
                        <i class="fas fa-save mr-1"></i> Cadastrar Usuário
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal Confirmação Apagar -->
<div class="modal fade" id="mensagem-apagar" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirmar Exclusão</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body text-center">
                <p class="mb-3">Deseja realmente inativar este usuário?</p>
                <button class="btn btn-brand w-100" id="botao-confirmacao">Confirmar Exclusão</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}
{% block scripts %}
<script>
    var table = $('#tabela-usuarios').DataTable({
        ajax: {
            url: '/usuarios',
            dataSrc: 'users'
        },
        language: {
            url: "/static/js/pt-BR.json"
        },
        pageLength: 10,
        bLengthChange: false,
        bFilter: true,
        columnDefs: [
            { className: "text-center", targets: "_all" }
        ],
        columns: [
            { 
                data: "usuario", 
                title: "Usuário",
                render: function(data) { return '<strong>' + escapeHtml(data) + '</strong>'; }
            },
            {
                data: "setor",
                title: "Setor",
                render: function(data, type) {
                    if (type === 'display') {
                        if(data === null || data === undefined || data === ""){
                            return "-";
                        }
                        var setores = {
                            "materia_prima": "Matéria-prima",
                            "estamparia": "Estamparia",
                            "solda": "Solda",
                            "retifica": "Retífica",
                            "envio_terceiros": "Envio para terceiros",
                            "recebimento_terceiros": "Recebimentos (terceiros)",
                            "inspecao_final": "Inspeção final",
                            "expedicao": "Expedição"
                        };
                        return escapeHtml(setores[data] || data);
                    }
                    return data;
                }
            },
            {
                data: "privilegio",
                title: "Nível Acesso",
                render: function(data, type) {
                    if (type === 'display') {
                        if (data == 3) return '<span class="badge badge-danger">Administrador</span>';
                        if (data == 2) return '<span class="badge badge-dark">PCP / Supervisor</span>';
                        if (data == 1) return '<span class="badge badge-secondary">Operacional</span>';
                        return "Desconhecido";
                    }
                    return data;
                }
            }
        ]
    });

    $('#tabela-usuarios').on('click', 'tbody tr', function () {
        var row = table.row(this);
        if (!row.data()) return;

        if ($(this).hasClass('tableSelected')) {
            $(this).removeClass('tableSelected');
        } else {
            table.$('tr.tableSelected').removeClass('tableSelected');
            $(this).addClass('tableSelected');
        }
    });

    jQuery('#botao-adicionar').on('click', function(){
        jQuery('#adicionar-modal').modal('show');
    });

    jQuery('#adicionar-usuario').on('blur', function(){
        var usuario = jQuery('#adicionar-usuario').val();
        if(!usuario) return;

        jQuery.ajax({
            url: '/usuariodisponivel',
            type: 'GET',
            data: { usuario: usuario },
            success: function(response){
                if(response.available){
                    jQuery('#adicionar-login-erro').text('');
                } else {
                    jQuery('#adicionar-login-erro').text('Usuário já existente');
                    jQuery('#adicionar-usuario').val('');
                    msgErro("Este usuário já está cadastrado.");
                }
            }
        });
    });

    $('#adicionar-formulario').on('submit', function(e){
        e.preventDefault();

        var senha = $('#adicionar-senha').val();
        var confirmar = $('#adicionar-confirmar-senha').val();
        var nivel = $('#adicionar-privilegios').val();
        var setor = $('#adicionar-setor').val();

        $('#adicionarSenhaErro').text('');
        $('#adicionar-login-erro').text('');

        if(senha !== confirmar){
            $('#adicionarSenhaErro').text("As senhas não conferem!");
            return;
        }

        if (nivel == "1" && (!setor || setor === "")) {
            $('#adicionar-login-erro').text("Selecione um setor para usuário operacional.");
            return;
        }

        $.ajax({
            url: '/adicionar_usuario',
            type: 'POST',
            data: {
                usuario: $('#adicionar-usuario').val(),
                setor: setor,
                privilegios: nivel,
                senha: senha,
                confirmar_senha: confirmar
            },
            success: function(response){
                if(response.success){
                    $('#adicionar-modal').modal('hide');
                    table.ajax.reload(null, false);
                    msgSucesso("Usuário cadastrado com sucesso.");
                } else {
                    msgErro(response.error);
                }
            },
            error: function(){
                msgErro("Erro ao comunicar com o servidor.");
            }
        });
    });

    $('#botao-editar').on('click', function(){
        var selectedRow = table.row('.tableSelected');
        if(!selectedRow.data()){
            msgAviso("Selecione um usuário na tabela primeiro.");
            return;
        }

        var data = selectedRow.data();
        $('#editar-id').val(data.id);
        $('#editar-usuario').val(data.usuario);
        $('#editar-setor').val(data.setor);
        $('#editar-privilegios').val(data.privilegio);
        $('#editar-nova-senha').val('');
        $('#editar-confirmar-senha').val('');
        $('#editarSenhaErro').text('');
        $('#editar-modal').modal('show');
    });

    $('#editar-formulario').on('submit', function(e){
        e.preventDefault();

        var nivel = $('#editar-privilegios').val();
        var setor = $('#editar-setor').val();
        var senha = $('#editar-nova-senha').val();
        var confirmar = $('#editar-confirmar-senha').val();

        if (nivel == "1" && (!setor || setor === "")) {
            msgAviso("Para usuário Operacional é obrigatório selecionar um setor.");
            return false;
        }

        if (senha !== confirmar) {
            $('#editarSenhaErro').text("As senhas não conferem!");
            return false;
        }

        $.ajax({
            url: '/usuarios',
            type: 'PUT',
            data: {
                id: $('#editar-id').val(),
                usuario: $('#editar-usuario').val(),
                setor: setor,
                privilegios: nivel,
                novaSenha: senha
            },
            success: function(response){
                if(response.success){
                    $('#editar-modal').modal('hide');
                    table.ajax.reload(null, false);
                    msgSucesso("Usuário modificado com sucesso.");
                } else {
                    msgErro(response.error || "Erro ao atualizar usuário.");
                }
            },
            error: function(){
                msgErro("Erro ao comunicar com o servidor.");
            }
        });
    });

    $('#botao-apagar').on('click', function(){
        var selectedRow = table.row('.tableSelected');
        if (!selectedRow.data()) {
            msgAviso("Selecione um usuário na tabela primeiro.");
            return;
        }
        $('#mensagem-apagar').modal('show');
    });

    const usuarioLogadoId = document.getElementById('usuarios-container').dataset.userId;

    $('#botao-confirmacao').on('click', function(){
        var selectedRow = table.row('.tableSelected');
        var data = selectedRow.data();

        if(Number(data.id) === Number(usuarioLogadoId)){
            msgErro("Não é possível excluir o próprio usuário.");
            $('#mensagem-apagar').modal('hide');
            return;
        }

        $('#mensagem-apagar').modal('hide');

        $.ajax({
            url: '/usuarios',
            type: 'DELETE',
            data: { id: data.id },
            success: function(response){
                if(response.deleted){
                    msgSucesso("Usuário removido com sucesso.");
                    table.ajax.reload(null, false);
                } else {
                    msgErro("Erro ao remover usuário.");
                }
            }
        });
    });

    $('#adicionar-privilegios').on('change', function () {
        var nivel = $(this).val();
        var setorSelect = $('#adicionar-setor');
        if (nivel == "1") {
            setorSelect.prop('disabled', false).prop('required', true);
        } else {
            setorSelect.val('').prop('disabled', true).prop('required', false);
        }
    });

    $('#adicionar-modal').on('show.bs.modal', function(){
        $('#adicionar-formulario')[0].reset();
        $('#adicionar-setor').val('').prop('disabled', true).prop('required', false);
    });

    $('#adicionar-modal').on('shown.bs.modal', function () {
        $('#adicionar-privilegios').trigger('change');
    });

    $('#editar-privilegios').on('change', function () {
        var nivel = $(this).val();
        var setorSelect = $('#editar-setor');
        if (nivel == "1") {
            setorSelect.prop('disabled', false).prop('required', true);
        } else {
            setorSelect.val('').prop('disabled', true).prop('required', false);
        }
    });

    $('#editar-modal').on('shown.bs.modal', function () {
        $('#editar-privilegios').trigger('change');
    });

    function toggleSenha(toggleId, inputId){
        const toggle = document.getElementById(toggleId);
        const campo = document.getElementById(inputId);
        if(!toggle || !campo) return;

        toggle.addEventListener("click", function(){
            if(campo.type === "password"){
                campo.type = "text";
                this.classList.remove("fa-eye");
                this.classList.add("fa-eye-slash");
            } else {
                campo.type = "password";
                this.classList.remove("fa-eye-slash");
                this.classList.add("fa-eye");
            }
        });
    }

    toggleSenha("toggleNovaSenha", "editar-nova-senha");
    toggleSenha("toggleConfirmarSenha", "editar-confirmar-senha");
    toggleSenha("toggleAdicionarSenha", "adicionar-senha");
    toggleSenha("toggleAdicionarConfirmarSenha", "adicionar-confirmar-senha");

    $(document).on('click', function(e){
        if (!$(e.target).closest('#tabela-usuarios, .modal, .btn').length) {
            table.$('tr.tableSelected').removeClass('tableSelected');
        }
    });
</script>
{% endblock %}
